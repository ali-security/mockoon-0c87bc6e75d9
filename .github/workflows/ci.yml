name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Optional mocha --grep pattern for the commons-server test suite (empty runs the full suite)"
        required: false
        default: ""

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Lint and check format
        run: |
          npm run lint
          npm run format

  test-libs:
    name: Libs - Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    needs: lint

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build and test
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            npm config set script-shell "C:\\Program Files\\Git\\bin\\bash.exe"
          fi
          npm run build:libs
          if [ -n "${{ inputs.test-filter }}" ]; then
            cd packages/commons-server && npm test -- --grep "${{ inputs.test-filter }}"
          else
            npm run test:libs
          fi
      - name: Pack commons-server
        if: matrix.os == 'ubuntu-latest'
        run: |
          cd packages/commons-server
          npm pack
          mv mockoon-commons-server-4.1.0.tgz commons-server-4.1.0.tgz
      - name: Upload commons-server tarball
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: commons-server-4.1.0
          path: packages/commons-server/commons-server-4.1.0.tgz
          if-no-files-found: error

  test-serverless:
    name: Serverless - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: [lint, test-libs]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build and test
        run: |
          npm run build:libs
          npm run build:serverless
          npm run test:serverless

  test-cli:
    name: CLI - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    needs: [lint, test-libs]

    strategy:
      fail-fast: false
      matrix:
        node: [16, 18, 20]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          if [ "${{ matrix.node }}" = "16" ]; then
            npm install -g npm@9
          else
            npm install -g npm@latest
          fi
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build and test
        run: |
          npm run build:libs
          npm run build:cli
          npm run test:cli

  # run all tests (unpackaged desktop app, CI build)
  test-desktop:
    name: Desktop - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30

    needs: [lint, test-libs]

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
      - name: Run tests
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          export DISPLAY=':99.0'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          set -o pipefail
          npm run test:desktop 2>&1 | tee desktop-test.log
          passing=$(awk 'match($0, /[0-9]+ passing/) { split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1] } END { print s+0 }' desktop-test.log)
          failing=$(awk 'match($0, /[0-9]+ failing/) { split(substr($0, RSTART, RLENGTH), a, " "); s+=a[1] } END { print s+0 }' desktop-test.log)
          echo "Desktop wdio total: ${passing} tests passing, ${failing} failing"

  # run desktop packaged tests when on the main branch (commits on main are always release candidates)

  test-desktop-packaged-win:
    name: Desktop packaged Windows - Build and test
    runs-on: windows-latest
    timeout-minutes: 60

    needs: [lint, test-libs]

    if: false

    env:
      CSC_LINK: ${{secrets.WIN_CSC_LINK}}
      CSC_KEY_PASSWORD: ${{secrets.WIN_CSC_KEY_PASSWORD}}

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
          npm run package:desktop:test:win
      - name: Run tests
        run: |
          npm run test:desktop:packaged:win

  test-desktop-packaged-mac:
    name: Desktop packaged MacOS - Build and test
    runs-on: macos-latest
    timeout-minutes: 120

    needs: [lint, test-libs]

    if: false

    env:
      APPLEID: ${{secrets.APPLEID}}
      TEAMID: ${{secrets.TEAMID}}
      APPLEIDPASS: ${{secrets.APPLEIDPASS}}
      ASCPROVIDER: ${{secrets.ASCPROVIDER}}
      CSC_LINK: ${{secrets.MACOS_CSC_LINK}}
      CSC_KEY_PASSWORD: ${{secrets.MACOS_CSC_KEY_PASSWORD}}
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
          npm run package:desktop:test:mac
      - name: Run tests
        run: |
          export DISPLAY=':99.0'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          npm run test:desktop:packaged:mac

  test-desktop-packaged-linux:
    name: Desktop packaged Linux - Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    needs: [lint, test-libs]

    if: false

    env:
      USE_HARD_LINKS: false

    steps:
      - uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18.x"
      - name: Update NPM
        run: |
          npm config set registry 'https://:2023-08-25T09%3A29%3A27.181Z@time-machines-npm.sealsecurity.io/'
          npm install -g npm@latest
      - uses: actions/cache@v4
        id: cache-modules
        with:
          path: "**/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
      - name: Install dependencies
        if: steps.cache-modules.outputs.cache-hit != 'true'
        run: |
          npm run bootstrap
      - name: Link packages
        run: |
          npm run link
      - name: Build
        run: |
          npm run build:libs
          npm run build:desktop:ci
          npm run package:desktop:test:linux
      - name: Run tests
        run: |
          export DISPLAY=':99.0'
          Xvfb :99 -screen 0 1024x768x24 > /dev/null 2>&1 &
          npm run test:desktop:packaged:linux
